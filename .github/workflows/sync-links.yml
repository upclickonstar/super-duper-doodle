name: Sync Links from Source

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch Core Content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git remote add upstream https://github.com || true
          git fetch upstream main
          
          # Safely pull only the raw markdown files containing the link lists
          git checkout upstream/main -- docs/*.md

          # Strip original names and replace them with your custom name
          find docs/ -name "*.md" -exec sed -i 's/fmhy/FreeForUs/gI' {} +
          find docs/ -name "*.md" -exec sed -i 's/freemediaheckyeah/FreeForUs/gI' {} +

          # Commit and Push back into your private repository
          git add docs/
          git commit -m "Automated nightly link update" || exit 0
          git push