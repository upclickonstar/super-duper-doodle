name: Sync Links from Source

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Fetch and Clean Links
        run: |
          # Force create the docs folder
          mkdir -p docs
          
          # Download files safely into a temporary sandbox folder
          git clone --depth=1 https://github.com temp-source
          
          # Copy only the link files over
          cp -r temp-source/docs/*.md docs/
          rm -rf temp-source

          # Strip old names and replace with your brand
          find docs/ -name "*.md" -exec sed -i 's/fmhy/FreeForUs/gI' {} +
          find docs/ -name "*.md" -exec sed -i 's/freemediaheckyeah/FreeForUs/gI' {} +

      - name: Force Push Updates Live
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'main'
